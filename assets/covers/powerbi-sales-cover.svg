<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AtliQ Tech Sales Insights Power BI dashboard cover" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowA" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#4c8dff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#7a64ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7a64ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c8dff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4c8dff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c8dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4c8dff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="640" height="360" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="360" fill="#08090b"/>
    <circle cx="90" cy="40" r="150" fill="url(#glowA)" filter="url(#softBlur)"/>
    <circle cx="560" cy="320" r="160" fill="url(#glowB)" filter="url(#softBlur)"/>

    <!-- faint grid -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <line x1="0" y1="90" x2="640" y2="90"/>
      <line x1="0" y1="180" x2="640" y2="180"/>
      <line x1="0" y1="270" x2="640" y2="270"/>
      <line x1="160" y1="0" x2="160" y2="360"/>
      <line x1="320" y1="0" x2="320" y2="360"/>
      <line x1="480" y1="0" x2="480" y2="360"/>
    </g>

    <!-- header row: app dot + label -->
    <circle cx="34" cy="32" r="5" fill="#4c8dff"/>
    <text x="48" y="37" font-family="'IBM Plex Mono', monospace" font-size="12" fill="rgba(242,243,245,0.55)">Power BI · Sales Performance</text>

    <!-- KPI glass card -->
    <rect x="28" y="56" width="164" height="80" rx="12" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.14)"/>
    <text x="46" y="94" font-family="'Space Grotesk', sans-serif" font-size="26" fill="#f2f3f5">₹984.9M</text>
    <text x="46" y="115" font-family="Inter, sans-serif" font-size="11" fill="rgba(242,243,245,0.5)">Revenue</text>

    <rect x="202" y="56" width="140" height="80" rx="12" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.14)"/>
    <text x="220" y="94" font-family="'Space Grotesk', sans-serif" font-size="26" fill="#f2f3f5">2.4M</text>
    <text x="220" y="115" font-family="Inter, sans-serif" font-size="11" fill="rgba(242,243,245,0.5)">Sales Qty</text>

    <!-- revenue trend line card -->
    <rect x="356" y="56" width="256" height="80" rx="12" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.14)"/>
    <text x="372" y="76" font-family="Inter, sans-serif" font-size="10" fill="rgba(242,243,245,0.5)">REVENUE TREND</text>
    <polyline points="372,120 400,110 428,124 456,96 484,112 512,86 540,100 568,80 596,92"
              fill="none" stroke="#4c8dff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="372,120 400,110 428,124 456,96 484,112 512,86 540,100 568,80 596,92 596,132 372,132"
             fill="url(#lineFill)"/>

    <!-- bar chart card: revenue by market -->
    <rect x="28" y="152" width="280" height="184" rx="12" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.14)"/>
    <text x="46" y="176" font-family="Inter, sans-serif" font-size="10" fill="rgba(242,243,245,0.5)">SUM OF SALES_QTY BY MARKETS</text>
    <g>
      <rect x="46" y="210" width="26" height="102" rx="3" fill="url(#barFill)" stroke="#4c8dff" stroke-width="1.2"/>
      <rect x="86" y="250" width="26" height="62" rx="3" fill="url(#barFill)" stroke="#4c8dff" stroke-width="1.2" opacity="0.85"/>
      <rect x="126" y="230" width="26" height="82" rx="3" fill="url(#barFill)" stroke="#4c8dff" stroke-width="1.2" opacity="0.85"/>
      <rect x="166" y="270" width="26" height="42" rx="3" fill="url(#barFill)" stroke="#4c8dff" stroke-width="1.2" opacity="0.7"/>
      <rect x="206" y="285" width="26" height="27" rx="3" fill="url(#barFill)" stroke="#4c8dff" stroke-width="1.2" opacity="0.6"/>
      <rect x="246" y="296" width="26" height="16" rx="3" fill="url(#barFill)" stroke="#4c8dff" stroke-width="1.2" opacity="0.5"/>
    </g>
    <line x1="46" y1="312" x2="272" y2="312" stroke="rgba(255,255,255,0.14)"/>

    <!-- donut chart card: top products -->
    <rect x="324" y="152" width="288" height="184" rx="12" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.14)"/>
    <text x="342" y="176" font-family="Inter, sans-serif" font-size="10" fill="rgba(242,243,245,0.5)">TOP 5 PRODUCTS</text>

    <g transform="translate(410,262)">
      <circle r="52" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="18"/>
      <circle r="52" fill="none" stroke="#4c8dff" stroke-width="18"
              stroke-dasharray="94 232" stroke-dashoffset="0" transform="rotate(-90)"/>
      <circle r="52" fill="none" stroke="#7a64ff" stroke-width="18"
              stroke-dasharray="55 271" stroke-dashoffset="-94" transform="rotate(-90)"/>
      <circle r="52" fill="none" stroke="#3cbedc" stroke-width="18"
              stroke-dasharray="45 281" stroke-dashoffset="-149" transform="rotate(-90)"/>
      <circle r="52" fill="none" stroke="rgba(242,243,245,0.35)" stroke-width="18"
              stroke-dasharray="32 294" stroke-dashoffset="-194" transform="rotate(-90)"/>
    </g>

    <g font-family="Inter, sans-serif" font-size="10" fill="rgba(242,243,245,0.65)">
      <circle cx="500" cy="228" r="4" fill="#4c8dff"/>
      <text x="510" y="232">Prod318 · 29%</text>
      <circle cx="500" cy="250" r="4" fill="#7a64ff"/>
      <text x="510" y="254">Prod316 · 17%</text>
      <circle cx="500" cy="272" r="4" fill="#3cbedc"/>
      <text x="510" y="276">Prod324 · 14%</text>
      <circle cx="500" cy="294" r="4" fill="rgba(242,243,245,0.35)"/>
      <text x="510" y="298">Prod329 · 10%</text>
    </g>

    <!-- footer label -->
    <text x="28" y="352" font-family="'Space Grotesk', sans-serif" font-size="17" fill="#f2f3f5">AtliQ Tech Sales Insights</text>
    <text x="612" y="352" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="11" fill="rgba(242,243,245,0.4)">2017–2020</text>

    <!-- outer border -->
    <rect x="0.5" y="0.5" width="639" height="359" rx="14" fill="none" stroke="rgba(255,255,255,0.1)"/>
  </g>
</svg>
