<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Command line expense tracker project cover">
  <rect width="640" height="360" fill="#101927"/>
  <!-- terminal window -->
  <rect x="60" y="50" width="520" height="260" rx="6" fill="#161F2C" stroke="#29384A" stroke-width="1.5"/>
  <rect x="60" y="50" width="520" height="30" rx="6" fill="#1B2532" stroke="#29384A" stroke-width="1.5"/>
  <circle cx="80" cy="65" r="5" fill="#F5A623"/>
  <circle cx="98" cy="65" r="5" fill="#2DD4BF"/>
  <circle cx="116" cy="65" r="5" fill="#4B5A6E"/>
  <text x="300" y="70" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8B97A8">expense_tracker.py</text>

  <g font-family="'IBM Plex Mono', monospace" font-size="13" fill="#8B97A8">
    <text x="80" y="108">$ python tracker.py add --category food --amt 450</text>
    <text x="80" y="132" fill="#2DD4BF">&gt; Added ₹450 to Food. Category total: ₹3,120 / ₹4,000</text>
    <text x="80" y="164">$ python tracker.py report --month sep</text>
    <text x="80" y="188" fill="#E7EDF3">  Category        Spent      Budget</text>
    <text x="80" y="208" fill="#E7EDF3">  Food            3,120       4,000</text>
    <text x="80" y="228" fill="#F5A623">  Travel          2,650       2,000  ⚠ over budget</text>
    <text x="80" y="248" fill="#E7EDF3">  Utilities       1,180       1,500</text>
    <text x="80" y="278" fill="#8B97A8">$ _</text>
  </g>

  <!-- small bar chart cropped bottom right, spend by category -->
  <g transform="translate(430,150)">
    <rect x="0" y="90" width="18" height="40" fill="#1B2532" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect x="26" y="60" width="18" height="70" fill="#1B2532" stroke="#F5A623" stroke-width="1.5"/>
    <rect x="52" y="105" width="18" height="25" fill="#1B2532" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect x="78" y="45" width="18" height="85" fill="#1B2532" stroke="#2DD4BF" stroke-width="1.5"/>
  </g>
  <text x="60" y="330" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#E7EDF3">Command-Line Expense Tracker</text>
</svg>
